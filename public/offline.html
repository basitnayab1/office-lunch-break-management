<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f6a5a" />
    <title>Bite Station</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #1c2430;
        background: linear-gradient(180deg, #f7f4ec 0%, #efe8db 100%);
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        background: #fffdf8;
        border: 1px solid #d9d2c4;
        border-radius: 18px;
        padding: 28px 24px;
        box-shadow: 0 18px 50px rgba(28, 36, 48, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 18px;
        color: #5b6573;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        background: #0f6a5a;
        color: #fff;
        text-decoration: none;
        border-radius: 999px;
        padding: 12px 20px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        A network connection is needed for login, break tracking, and sync.
        Reconnect, then open the app again.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
